<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Cosmos · Real-Scale Solar System</title>
    <meta name="description" content="Fly a small white starship through a real-scale Solar System with real planet maps, real star positions and warp drive up to 100 times the speed of light." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="intro">
    <canvas id="scene"></canvas>
    <div id="ui"></div>
    <div id="fade"></div>
    <div id="loading">
      <canvas id="load-stars" aria-hidden="true"></canvas>
      <div class="intro-load">
        <div class="intro-orbit" aria-hidden="true"></div>
        <div class="intro-word">Cosmos</div>
        <div class="load-track"><div id="load-bar"></div></div>
        <div class="load-meta"><span id="load-text">Starting</span><span id="load-pct"></span></div>
      </div>
      <div class="intro-title">
        <p class="intro-eyebrow">A real-scale Solar System</p>
        <h1 class="intro-word">Cosmos</h1>
        <p class="intro-lede">Real planets, real stars, real distances. Fly anywhere, up to a hundred times faster than light.</p>
        <div class="intro-actions">
          <button id="start" class="intro-launch" type="button">
            Launch
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          </button>
          <span class="intro-hint">or press Enter</span>
          <button id="start-fresh" class="intro-fresh" type="button">New flight</button>
        </div>
        <p id="resume-where" class="intro-resume"></p>
        <p class="intro-rotate">Turn your phone sideways to fly</p>
      </div>
      <div class="intro-foot" aria-hidden="true">
        <span>Real planet maps</span>
        <span>112,699 stars</span>
        <span>Live positions</span>
      </div>
      <button id="notes-open" class="notes-btn" type="button" aria-haspopup="dialog" aria-controls="notes-pop">
        <span class="notes-dot" aria-hidden="true"></span>What's new<span id="notes-ver" class="notes-ver"></span>
      </button>
      <div id="notes-pop" class="notes-pop" role="dialog" aria-modal="true" aria-labelledby="notes-heading">
        <div class="notes-backdrop" data-close></div>
        <div class="notes-card">
          <div class="notes-top">
            <h2 id="notes-heading" class="notes-heading">Patch notes</h2>
            <button class="notes-close" type="button" aria-label="Close patch notes" data-close>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </div>
          <ol id="patch-notes" class="notes-list"></ol>
        </div>
      </div>
    </div>
    <div id="rotate" aria-hidden="true">
      <div class="rot-phone"></div>
      <div class="rot-text">Rotate your phone to fly</div>
    </div>
    <noscript>Cosmos needs JavaScript and WebGL 2.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
